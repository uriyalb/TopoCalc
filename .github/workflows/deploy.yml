name: CI & Deploy to GitHub Pages

# GitHub Pages serves one site per repository, so every deploy publishes both:
#   main  -> https://<user>.github.io/<repo>/
#   stage -> https://<user>.github.io/<repo>/stage/
on:
  push:
    branches: [main, stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:features
      - run: npm run build

  build:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
    runs-on: ubuntu-latest
    env:
      VITE_STANDALONE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Check out stage (if it exists)
        id: stage
        run: |
          if git -C main ls-remote --exit-code --heads origin stage >/dev/null; then
            git clone --depth 1 --branch stage "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stage
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'

      # base_path is "/<repo>" on github.io and "" once a custom domain is set
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build main
        working-directory: main
        run: |
          npm ci
          npm run lint
          npm run typecheck:features --if-present
          npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Build stage
        if: steps.stage.outputs.exists == 'true'
        working-directory: stage
        run: |
          npm ci
          npm run lint
          npm run typecheck:features --if-present
          npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/stage/
          VITE_STAGE: 'true'

      - name: Assemble site
        run: |
          mv main/dist site
          cp site/index.html site/404.html
          if [ -d stage/dist ]; then mv stage/dist site/stage; fi
          # Only the root 404.html (the main build) catches unknown paths, so give
          # stage-only routes their own copy of the stage index to deep-link into.
          if [ -d site/stage ]; then mkdir -p site/stage/bg && cp site/stage/index.html site/stage/bg/index.html; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
